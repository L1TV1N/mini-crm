<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оставить заявку</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..700&family=Unbounded:wght@300..800&display=swap">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23FF4F1A'/%3E%3C/svg%3E">
<script src="/theme.js"></script>
</head>
<body class="public">
<main class="pub">
  <form id="form" novalidate>
    <h1>Расскажите, что нужно<i></i></h1>
    <p class="mute">Оставьте контакты и коротко опишите задачу. Менеджер свяжется с вами.</p>
    <div class="field"><label class="lbl" for="name">Как к вам обращаться</label><input class="input" id="name" name="name" maxlength="100" autocomplete="name" required></div>
    <div class="field"><label class="lbl" for="contact">Телефон, e-mail или @username</label><input class="input" id="contact" name="contact" maxlength="200" autocomplete="tel" required></div>
    <div class="field"><label class="lbl" for="request">Что нужно сделать</label><textarea class="input" id="request" name="request" rows="4" maxlength="2000"></textarea></div>
    <div class="hp" aria-hidden="true"><label>Сайт<input id="website" name="website" tabindex="-1" autocomplete="off"></label></div>
    <button class="btn accent" id="send">Отправить заявку</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <div id="done" class="done" hidden>
    <h1>Заявка принята<i></i></h1>
    <p class="mute">Спасибо! Мы свяжемся с вами в ближайшее время.</p>
    <button class="btn" id="again">Отправить ещё одну</button>
  </div>
</main>
<script src="/form.js"></script>
</body>
</html>
