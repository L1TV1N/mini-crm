# /etc/nginx/sites-available/mini-crm (https), __DOMAIN__ и __PORT__ подставляет setup.sh, когда сертификат уже выпущен
limit_req_zone $binary_remote_addr zone=minicrm_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=minicrm_form:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # подтверждение домена для продления сертификата, остальное уходит на https
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__ www.__DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:minicrm_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=604800" always;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json text/csv image/svg+xml;

    # адрес клиента перезаписываем, а не дописываем: подделанный X-Forwarded-For от клиента не пройдёт
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # подбор пароля: не больше 10 попыток в минуту с одного адреса
    location = /api/login {
        limit_req zone=minicrm_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:__PORT__;
    }

    location = /api/public/lead {
        limit_req zone=minicrm_form burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:__PORT__;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
    }
}
